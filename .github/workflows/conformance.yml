name: conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install binary verification debugger (gdb)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdb

      - name: Install ajar and dev dependencies
        run: python3 -m pip install -e ".[dev]"

      - name: Check AGENTS.md line budget (<= 50 lines)
        run: |
          lines=$(wc -l < AGENTS.md)
          echo "AGENTS.md lines: $lines"
          test "$lines" -le 50

      - name: Lint with ruff
        run: ruff check ajar tests tools/arch_lint.py skills/security-advisory-report/scripts/report_voice_lint.py

      - name: Check mechanical architecture guardrails
        run: python3 tools/arch_lint.py

      - name: Static type-check with mypy
        run: mypy --strict ajar tools/arch_lint.py skills/security-advisory-report/scripts/report_voice_lint.py

      - name: Run unit, gate, redaction, and conformance suite
        run: pytest -q

      - name: Run archived historical record reader tests
        run: |
          for t in tools/legacy/*-test.py; do
            python3 "$t"
          done
