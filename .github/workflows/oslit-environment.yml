name: OSLit owned environment

on:
  push:
    branches: [main, codex/oslit-team-contract, codex/oslit-integrated-e2e-20261115]
    paths:
      - .github/workflows/oslit-environment.yml
      - tools/research_environment.py
      - tools/engagement_lease_owner.py
      - tools/engagement_workspace.py
      - tools/engagement_contract.py
      - tools/engagement_controller.py
      - tools/engagement_evidence.py
      - tools/engagement_runner.py
      - tools/engagement_native_boundary.py
      - tools/engagement_network*.py
      - tools/application_state.py
      - tools/target_accounts.py
      - tools/native_credentials.py
      - tools/native_runtime_*.py
      - tools/native_runtime_codex_exec.mjs
      - tools/install_native_tools.py
      - tools/native_model_addon.py
      - config/native-tool-lock.json
      - engine/native-engagement-*.md
      - evals/native-qualification/smoke/check_model_image_docker_e2e.py
      - evals/native-qualification/smoke/check_linux_model_native_e2e.py
      - evals/native-qualification/smoke/check_native_userns_probe.py
      - evals/native-qualification/smoke/check_codex_sandbox_policy_diagnostic.py
      - evals/native-qualification/smoke/check_omp_stderr_diagnostic.py
      - evals/native-qualification/smoke/check_omp_invocation_diagnostics.py
      - evals/native-qualification/smoke/check_omp_public_credential_reference.py
      - evals/native-qualification/smoke/check_omp_loader_preflight*.py
      - evals/native-qualification/smoke/check_omp_model_addon_assets.py
      - evals/native-qualification/smoke/check_environment_docker_e2e.py
      - evals/native-qualification/smoke/check_container_guardian_e2e.py
      - evals/native-qualification/smoke/check_application_owner_docker_e2e.py
      - evals/native-qualification/smoke/check_application_owner_e2e.py
      - evals/native-qualification/smoke/run_environment_loopback_ssh_e2e.sh
  pull_request:
    paths:
      - .github/workflows/oslit-environment.yml
      - tools/research_environment.py
      - tools/engagement_lease_owner.py
      - tools/engagement_workspace.py
      - tools/engagement_contract.py
      - tools/engagement_controller.py
      - tools/engagement_evidence.py
      - tools/engagement_runner.py
      - tools/engagement_native_boundary.py
      - tools/engagement_network*.py
      - tools/application_state.py
      - tools/target_accounts.py
      - tools/native_credentials.py
      - tools/native_runtime_*.py
      - tools/native_runtime_codex_exec.mjs
      - tools/install_native_tools.py
      - tools/native_model_addon.py
      - config/native-tool-lock.json
      - engine/native-engagement-*.md
      - evals/native-qualification/smoke/check_model_image_docker_e2e.py
      - evals/native-qualification/smoke/check_linux_model_native_e2e.py
      - evals/native-qualification/smoke/check_native_userns_probe.py
      - evals/native-qualification/smoke/check_codex_sandbox_policy_diagnostic.py
      - evals/native-qualification/smoke/check_omp_stderr_diagnostic.py
      - evals/native-qualification/smoke/check_omp_invocation_diagnostics.py
      - evals/native-qualification/smoke/check_omp_public_credential_reference.py
      - evals/native-qualification/smoke/check_omp_loader_preflight*.py
      - evals/native-qualification/smoke/check_omp_model_addon_assets.py
      - evals/native-qualification/smoke/check_environment_docker_e2e.py
      - evals/native-qualification/smoke/check_container_guardian_e2e.py
      - evals/native-qualification/smoke/check_application_owner_docker_e2e.py
      - evals/native-qualification/smoke/check_application_owner_e2e.py
      - evals/native-qualification/smoke/run_environment_loopback_ssh_e2e.sh

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select the disposable fixture image
        run: |
          docker --host unix:///var/run/docker.sock pull python:3.11-slim-bookworm
          image_id=$(docker --host unix:///var/run/docker.sock image inspect --format '{{.Id}}' python:3.11-slim-bookworm)
          printf 'OSLIT_FIXTURE_IMAGE=%s\n' "$image_id" >> "$GITHUB_ENV"
      - name: Exercise the production environment with harmless inputs
        run: |
          python3 evals/native-qualification/smoke/check_environment_docker_e2e.py \
            --endpoint unix:///var/run/docker.sock \
            --image-id "$OSLIT_FIXTURE_IMAGE" \
            --output "$RUNNER_TEMP/oslit-docker/result.json"
      - name: Verify the container lease owner and adopted children
        if: ${{ !cancelled() && env.OSLIT_FIXTURE_IMAGE != '' }}
        run: |
          python3 evals/native-qualification/smoke/check_container_guardian_e2e.py \
            --endpoint unix:///var/run/docker.sock \
            --image-id "$OSLIT_FIXTURE_IMAGE" \
            --output "$RUNNER_TEMP/oslit-docker/guardian.json"
      - name: Exercise the SSH transport through an owned loopback listener
        if: ${{ !cancelled() && env.OSLIT_FIXTURE_IMAGE != '' }}
        run: |
          bash evals/native-qualification/smoke/run_environment_loopback_ssh_e2e.sh \
            "$OSLIT_FIXTURE_IMAGE" "$RUNNER_TEMP/oslit-docker"
      - name: Verify owned application reset and exact recovery
        if: ${{ !cancelled() && env.OSLIT_FIXTURE_IMAGE != '' }}
        run: |
          python3 evals/native-qualification/smoke/check_application_owner_docker_e2e.py \
            --endpoint unix:///var/run/docker.sock \
            --image-id "$OSLIT_FIXTURE_IMAGE" \
            --output "$RUNNER_TEMP/oslit-docker/application-owner.json"
      - name: Preserve actual environment observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oslit-docker-${{ github.sha }}
          path: ${{ runner.temp }}/oslit-docker/*.json
          if-no-files-found: warn

  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runtime: [codex, omp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the pinned base on this disposable runner
        run: |
          docker --host unix:///var/run/docker.sock pull \
            python@sha256:a83ba18aef0f865b1a4a611c2cf460fe446f2795673bbb9fe43be570439e3b39
      - name: Check bounded loader-preflight contract
        if: matrix.runtime == 'omp'
        run: |
          python3 evals/native-qualification/smoke/check_omp_loader_preflight_test.py
          python3 evals/native-qualification/smoke/check_omp_stderr_diagnostic.py
          python3 evals/native-qualification/smoke/check_omp_invocation_diagnostics.py
          python3 evals/native-qualification/smoke/check_omp_public_credential_reference.py
          python3 evals/native-qualification/smoke/check_omp_model_addon_assets.py
      - name: Check pinned native startup without provider invocation
        if: ${{ !cancelled() }}
        run: |
          script=evals/native-qualification/smoke/check_omp_loader_preflight.py
          python3 "$script" \
            --runtime "${{ matrix.runtime }}" --platform linux/amd64 \
            --base-image python@sha256:a83ba18aef0f865b1a4a611c2cf460fe446f2795673bbb9fe43be570439e3b39 \
            --endpoint unix:///var/run/docker.sock \
            --directory "$RUNNER_TEMP/oslit-model-assets-${{ matrix.runtime }}" \
            --output "$RUNNER_TEMP/oslit-native-${{ matrix.runtime }}/result.json"
      - name: Run joined native engagement through work, stop and cleanup
        if: ${{ !cancelled() }}
        run: |
          python3 evals/native-qualification/smoke/check_linux_model_native_e2e.py \
            --runtime "${{ matrix.runtime }}" --platform linux/amd64 \
            --base-image python@sha256:a83ba18aef0f865b1a4a611c2cf460fe446f2795673bbb9fe43be570439e3b39 \
            --endpoint unix:///var/run/docker.sock \
            --directory "$RUNNER_TEMP/oslit-native-e2e-assets-${{ matrix.runtime }}" \
            --output "$RUNNER_TEMP/oslit-native-e2e-${{ matrix.runtime }}/result.json"
      - name: Preserve native observations without private or large build assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oslit-native-${{ matrix.runtime }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/oslit-native-${{ matrix.runtime }}/result.json
            ${{ runner.temp }}/oslit-native-e2e-${{ matrix.runtime }}/*
          if-no-files-found: warn
