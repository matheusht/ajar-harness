name: OSLit export references

on:
  pull_request:
    paths:
      - '.github/workflows/oslit-export-references.yml'
      - 'tools/**'
      - 'evals/native-qualification/smoke/**'
      - 'engine/**'
      - 'requirements-ci.txt'

permissions:
  contents: read

jobs:
  reference-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Verify offline export reference closure
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 evals/native-qualification/smoke/check_engagement_export_references_e2e.py -v
          python3 evals/native-qualification/smoke/check_engagement_export_result_e2e.py -v
