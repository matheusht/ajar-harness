[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ajar"
version = "3.2.0"
description = "Ajar finds, disproves, reproduces, and patches software vulnerabilities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "jsonschema==4.26.0",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
ajar = "ajar.cli:main"

[tool.setuptools.packages.find]
include = ["ajar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tools/legacy", "engagements", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
