[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ajar"
version = "3.6.0"
description = "Ajar v3.6 Three-Ring Earned-Mass autonomous security auditing and verification engine."
readme = "README.md"
requires-python = ">=3.11.4"
dependencies = []

[project.optional-dependencies]
dev = [
    "jsonschema==4.26.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
ajar = "ajar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ajar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: end-to-end tests invoking external compilers/debuggers (gcc, go, cargo, gdb), live HTTP, or multi-subprocess CLI suites",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tools/legacy", "engagements", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]
